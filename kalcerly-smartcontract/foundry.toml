[profile.default]
src = "src"
out = "out"
libs = ["lib"]
gas_price = 3000000000   # 3 gwei (default buat broadcast). Biar tx BSC testnet gak nyangkut; pakai --legacy pas deploy.

[lint]
exclude_lints = ["block-timestamp", "erc20-unchecked-transfer"]

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"

[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options